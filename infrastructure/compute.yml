AWSTemplateFormatVersion: "2010-09-09"
Description: "ETL Lambda + Schedule with VPC and RDS access"

Parameters:
  LambdaS3Bucket:
    Type: String
  LambdaS3Key:
    Type: String
  RDSHost:
    Type: String
  RDSPort:
    Type: String
  RDSPassword:
    Type: String
    NoEcho: true

Resources:

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: "sts:AssumeRole"
      Policies:
        - PolicyName: LambdaBasicExecution
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: "*"

  ETLLambdaSeed:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: seed.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Environment:
        Variables:
          AWS_DB_HOST: !Ref RDSHost
          AWS_DB_PORT: !Ref RDSPort
          AWS_DB_USERNAME: etl_user
          AWS_DB_PASSWORD: !Ref RDSPassword
          AWS_DB_NAME: etldb
      Timeout: 900
      MemorySize: 512
      VpcConfig:
        SubnetIds:
          - !ImportValue ETL-PrivateSubnet1
          - !ImportValue ETL-PrivateSubnet2
        SecurityGroupIds:
          - !ImportValue ETL-RDS-SG


  ETLLambda:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: run_etl_pipeline.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref LambdaS3Bucket
        S3Key: !Ref LambdaS3Key
      Environment:
        Variables:
          AWS_DB_HOST: !Ref RDSHost
          AWS_DB_PORT: !Ref RDSPort
          AWS_DB_USERNAME: etl_user
          AWS_DB_PASSWORD: !Ref RDSPassword
          AWS_DB_NAME: etldb
      Timeout: 900
      MemorySize: 512
      VpcConfig:
        SubnetIds:
          - !ImportValue ETL-PrivateSubnet1
          - !ImportValue ETL-PrivateSubnet2
        SecurityGroupIds:
          - !ImportValue ETL-RDS-SG

  ETLScheduleRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: "cron(0 4 * * ? *)"  # 4am UTC daily
      Targets:
        - Arn: !GetAtt ETLLambda.Arn
          Id: ETLLambdaTarget

  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref ETLLambda
      Action: "lambda:InvokeFunction"
      Principal: events.amazonaws.com
      SourceArn: !GetAtt ETLScheduleRule.Arn

Outputs:
  LambdaName:
    Value: !Ref ETLLambda
    Export:
      Name: ETL-Lambda
