AWSTemplateFormatVersion: "2010-09-09"
Description: "S3 bucket for ETL Lambda code"

Parameters:
  BucketName:
    Type: String

Resources:
  LambdaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Ref BucketName

Outputs:
  LambdaBucketName:
    Value: !Ref LambdaBucket
    Export:
      Name: ETL-Lambda-Bucket
