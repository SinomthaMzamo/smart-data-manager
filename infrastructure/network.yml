  #     Principal: events.amazonaws.com
  #     SourceArn: !GetAtt DailyETLSchedule.Arn

  # ============================================
  # CloudWatch Alarms
  # ============================================
  RDSCPUAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub ${Environment}-rds-high-cpu
      AlarmDescription: Alert when RDS CPU exceeds 80%
      MetricName: CPUUtilization
      Namespace: AWS/RDS
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: !Ref DBInstance

  # LambdaErrorAlarm:
  #   Type: AWS::CloudWatch::Alarm
  #   Properties:
  #     AlarmName: !Sub ${Environment}-lambda-errors
  #     AlarmDescription: Alert on Lambda function errors
  #     MetricName: Errors
  #     Namespace: AWS/Lambda
  #     Statistic: Sum
  #     Period: 300
  #     EvaluationPeriods: 1
  #     Threshold: 5
  #     ComparisonOperator: GreaterThanThreshold
  #     TreatMissingData: notBreaching

Outputs:
  VPCId:
    Description: VPC ID
    Value: !Ref VPC
    Export:
      Name: !Sub ${Environment}-etl-vpc-id

  DBEndpoint:
    Description: RDS SQL Server endpoint
    Value: !GetAtt DBInstance.Endpoint.Address
    Export:
      Name: !Sub ${Environment}-etl-db-endpoint

  DBPort:
    Description: RDS SQL Server port
    Value: !GetAtt DBInstance.Endpoint.Port
    Export:
      Name: !Sub ${Environment}-etl-db-port

  DBSecretArn:
    Description: ARN of the database credentials secret
    Value: !Ref DBSecret
    Export:
      Name: !Sub ${Environment}-etl-db-secret-arn

