  # ============================================
  # DailyETLSchedule:
  #   Type: AWS::Events::Rule
  #   Properties:
  #     Name: !Sub ${Environment}-daily-etl-schedule
  #     Description: Trigger daily sales ETL at 2 AM
  #     ScheduleExpression: 'cron(0 2 * * ? *)'  # 2 AM UTC daily
  #     State: ENABLED
  #     Targets:
  #       - Arn: !GetAtt DailySalesETLFunction.Arn
  #         Id: DailySalesTarget

  # DailyETLPermission:
  #   Type: AWS::Lambda::Permission
